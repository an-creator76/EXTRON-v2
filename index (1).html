<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ExXon Team 2 | Beyond the Boundaries</title>

<style>
:root{--bg:#07040f;--ink:#e9fbff;--mute:#9a8fc4;--cy:#00f0ff;--mg:#ff2bd6;--ye:#f5e50a;--fd:"Orbitron","Arial Black",system-ui,sans-serif;--fb:"Rajdhani","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:500 17px/1.4 var(--fb)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--ye);outline-offset:3px}
.sea{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#07040f,#2a0a4a 48%)}
.sea::before{content:"";position:absolute;left:0;right:0;top:48%;bottom:0;z-index:1;background:linear-gradient(#1a0838,#07040f)}
.sun{position:absolute;left:50%;top:48%;width:74vmin;height:74vmin;translate:-50% -66%;border-radius:50%;background:linear-gradient(#f5e50a,#ff2bd6 58%,#6a1bff);opacity:.85;-webkit-mask:linear-gradient(#000 0 52%,transparent 52% 57%,#000 57% 64%,transparent 64% 71%,#000 71% 80%,transparent 80% 89%,#000 89%);mask:linear-gradient(#000 0 52%,transparent 52% 57%,#000 57% 64%,transparent 64% 71%,#000 71% 80%,transparent 80% 89%,#000 89%)}
.floor{position:absolute;left:-60%;right:-60%;top:48%;height:62%;z-index:2;overflow:hidden;transform:perspective(380px) rotateX(64deg);transform-origin:50% 0;-webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
.cells{position:absolute;inset:-48px 0 0;background:linear-gradient(rgba(0,240,255,.85) 2px,transparent 2px) 0 0/100% 48px,linear-gradient(90deg,rgba(0,240,255,.85) 2px,transparent 2px) 0 0/72px 100%;will-change:transform;animation:flow 1.2s linear infinite}
@keyframes flow{to{transform:translateY(48px)}}
.bub{position:absolute;bottom:-30px;z-index:3;border:1px solid currentColor;box-shadow:0 0 8px currentColor;will-change:transform;animation:up linear infinite}
@keyframes up{to{transform:translate3d(var(--sw),-115vh,0) rotate(180deg)}}
.scan{position:fixed;inset:0;z-index:50;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.16) 2px 3px)}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;transition:transform .7s cubic-bezier(.2,.9,.2,1)}
.open .hero{transform:translateY(-21vh) scale(.8)}
.wrap{position:relative;width:min(80vw,440px);aspect-ratio:800/288;filter:drop-shadow(0 0 12px rgba(0,240,255,.6)) drop-shadow(0 0 28px rgba(255,43,214,.45));transform:perspective(900px) rotateY(calc(var(--px,0)*14deg)) rotateX(calc(var(--py,0)*-9deg));transition:transform .25s ease-out}
.ring{position:absolute;inset:0;margin:auto;width:70%;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--cy);opacity:0;animation:ring 4.8s ease-out infinite;animation-delay:calc(var(--r)*1.6s + .5s)}
.ring:nth-child(2){border-color:var(--mg)}
@keyframes ring{0%{transform:scale(.2);opacity:.8}100%{transform:scale(3);opacity:0}}

.logo,.gl{position:absolute;inset:0}
.logo{background:linear-gradient(105deg,#e9fbff 0 34%,#00f0ff 44%,#ff2bd6 52%,#e9fbff 62% 100%) 0 0/300% 100%;clip-path:inset(0 100% 0 0);animation:draw 1.5s cubic-bezier(.65,0,.2,1) .3s forwards,sheen 4.5s linear 1.9s infinite}
.gl{opacity:0;animation:glitch 3.4s steps(1) 2.2s infinite}
.gl.c{background:var(--cy)}
.gl.m{background:var(--mg);animation-delay:2.25s;animation-direction:reverse}
@keyframes glitch{0%,90%,100%{opacity:0}91%{opacity:.9;translate:-7px 2px;clip-path:inset(8% 0 58% 0)}94%{opacity:.9;translate:7px -2px;clip-path:inset(58% 0 8% 0)}97%{opacity:.9;translate:-3px 0;clip-path:inset(30% 0 40% 0)}}
@keyframes draw{to{clip-path:inset(0)}}
@keyframes sheen{to{background-position:100% 0}}
.slogan{margin:24px 0 0;font:800 clamp(.95rem,4.6vw,1.4rem)/1.3 var(--fd);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 0 10px var(--cy),2px 0 var(--mg),-2px 0 var(--cy);animation:flick 5s linear 3s infinite}
@keyframes flick{0%,89%,93%,100%{opacity:1}91%,95%{opacity:.5}}
.slogan span{display:inline-block;opacity:0;animation:word .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(1.6s + var(--w)*.2s)}
@keyframes word{from{opacity:0;transform:translateY(22px);filter:blur(10px)}to{opacity:1;transform:none;filter:blur(0)}}
.line{width:min(60vw,260px);height:2px;margin:16px auto 28px;background:linear-gradient(90deg,transparent,var(--cy),var(--mg),transparent);box-shadow:0 0 12px var(--mg);transform:scaleX(0);animation:line 1s ease-out 2.3s forwards}
@keyframes line{to{transform:scaleX(1)}}
.glass{position:relative;overflow:hidden;cursor:pointer;color:var(--ink);font:700 1rem var(--fd);letter-spacing:.14em;text-transform:uppercase;padding:14px 28px;border-radius:4px 18px 4px 18px;border:1px solid var(--cy);background:linear-gradient(135deg,rgba(0,240,255,.22),rgba(255,43,214,.16));-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);box-shadow:0 0 16px rgba(0,240,255,.45),inset 0 0 14px rgba(255,43,214,.25);text-shadow:0 0 8px var(--cy);touch-action:manipulation;transition:scale .15s cubic-bezier(.2,1.4,.4,1),box-shadow .2s}
.glass:hover{box-shadow:0 0 26px rgba(0,240,255,.85),inset 0 0 18px rgba(255,43,214,.4)}
.glass:active{scale:.93}
.rp{position:absolute;width:20px;height:20px;border-radius:50%;translate:-50% -50%;background:radial-gradient(circle,rgba(0,240,255,.8),rgba(0,240,255,0) 70%);pointer-events:none;animation:rp .65s ease-out forwards}
@keyframes rp{to{transform:scale(16);opacity:0}}
.go{opacity:0;animation:fadeup .8s cubic-bezier(.2,.9,.2,1) 2.6s forwards}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.4) 50%,transparent 60%);translate:-120% 0;animation:glint 4s ease-in-out 3.4s infinite;pointer-events:none}
@keyframes glint{60%,100%{translate:120% 0}}
@keyframes fadeup{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.orbit{position:absolute;left:0;right:0;top:45vh;height:250px;perspective:850px;visibility:hidden;opacity:0;pointer-events:none;touch-action:none;cursor:grab;transition:opacity .5s,visibility 0s .5s}
.open .orbit{visibility:visible;opacity:1;pointer-events:auto;transition-delay:.1s,0s}
.ring3d{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.pc{position:absolute;left:-56px;top:-75px;width:112px;height:150px;padding:0;border:1.5px solid var(--cy);border-radius:6px 22px 6px 22px;overflow:hidden;background:#12062b;color:var(--ink);font:inherit;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(calc(var(--i)*40deg)) translateZ(178px);box-shadow:0 0 18px rgba(0,240,255,.55),inset 0 0 0 1px rgba(255,43,214,.5);cursor:pointer;opacity:0}
.open .pc{animation:gather .9s cubic-bezier(.2,1.2,.3,1) calc(var(--i)*50ms + 100ms) both}
@keyframes gather{from{opacity:0;scale:.15}to{opacity:1;scale:1}}
.pc img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 18%;filter:saturate(1.3) contrast(1.1);pointer-events:none}
.pc::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 2px,rgba(0,0,0,.22) 2px 3px),linear-gradient(160deg,rgba(0,240,255,.25),transparent 45%,rgba(255,43,214,.3));pointer-events:none}
.pc b{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:12px 4px 7px;font:700 .72rem var(--fd);letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(transparent,rgba(7,4,15,.95));text-shadow:0 0 8px var(--cy)}
.page{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px));overflow:hidden;touch-action:none;background:radial-gradient(80% 45% at 50% 28%,rgba(255,43,214,.3),transparent 70%),radial-gradient(70% 40% at 50% 100%,rgba(0,240,255,.22),transparent 70%),#07040f;clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .5s cubic-bezier(.7,0,.2,1),visibility 0s .5s}
.page.on{clip-path:inset(0);visibility:visible;transition-delay:0s}
.bar{display:flex;justify-content:space-between;align-items:center}
.bar .glass{padding:10px 20px;font-size:.85rem}
.mini{display:block;width:96px;aspect-ratio:800/288;background:var(--ink)}
.tilt{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform-style:preserve-3d;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s ease-out}
.tilt:not(.t){animation:sway 5s ease-in-out infinite alternate}
@keyframes sway{from{transform:perspective(900px) rotateY(-9deg) rotateX(4deg)}to{transform:perspective(900px) rotateY(9deg) rotateX(-3deg)}}
.tilt>*{position:relative;animation:fadeup .55s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--k,0)*70ms + 250ms)}
.cw{width:min(46vw,190px);aspect-ratio:1;margin:0 0 20px;translate:0 0 70px;transform-style:preserve-3d;cursor:pointer}
.cw::before,.cw::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.cw::before{inset:-14px;border:2px dashed var(--cy);animation:spin 10s linear infinite}
.cw::after{inset:-28px;border:2px dotted var(--mg);animation:spin 16s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.coin{position:absolute;inset:0;transform-style:preserve-3d;animation:coin 7s ease-in-out infinite}
@keyframes coin{0%,38%{transform:rotateY(0)}50%,88%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
.f,.cb{position:absolute;inset:0;border-radius:50%;padding:5px;background:conic-gradient(var(--cy),var(--mg),var(--ye),var(--cy));box-shadow:0 0 26px rgba(255,43,214,.6);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 20%;border:4px solid #12062b;background:#12062b}
.cb{transform:rotateY(180deg)}
.cb div{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#3b0a5c,#0b0420)}
.cb .mini{width:74%}
.gt{position:relative;margin:10px 0 0;font:900 clamp(2rem,11vw,3.1rem)/1 var(--fd);letter-spacing:.04em;text-transform:uppercase;translate:0 0 50px;text-shadow:0 0 14px rgba(0,240,255,.6)}
.gt::before,.gt::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:0;text-shadow:none}
.gt::before{color:var(--cy);translate:-4px 0;animation:g1 2.8s steps(1) infinite}
.gt::after{color:var(--mg);translate:4px 0;animation:g1 2.3s steps(1) .4s infinite reverse}
@keyframes g1{0%,85%,100%{opacity:0}86%{opacity:1;clip-path:inset(15% 0 55% 0)}91%{opacity:1;clip-path:inset(62% 0 8% 0)}}
.sk{margin:10px 0 0;font:700 1.25rem var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 10px var(--cy);translate:0 0 36px}
.chip{display:inline-block;margin-top:10px;padding:6px 14px;border-radius:2px 12px 2px 12px;background:var(--ye);color:#1a1500;font:800 .8rem var(--fd);letter-spacing:.12em;text-transform:uppercase;box-shadow:0 0 16px rgba(245,229,10,.6);translate:0 0 40px}
.fx{position:relative;width:100%;max-width:420px;height:min(22vh,150px);margin-top:18px;overflow:hidden;border:1px solid rgba(0,240,255,.55);border-radius:4px 22px 4px 22px;background:rgba(0,240,255,.07);box-shadow:inset 0 0 24px rgba(255,43,214,.2),0 0 18px rgba(0,240,255,.25);translate:0 0 24px;touch-action:none}
.hint{margin:10px 0 0;font-size:.85rem;color:var(--mute);letter-spacing:.06em}
.nav{display:flex;gap:12px;justify-content:center}
.nav .glass{flex:1;max-width:170px;padding:12px 10px;font-size:.85rem}
.big{position:absolute;left:50%;top:50%;translate:-50% -50%;font-size:3.4rem;line-height:1;filter:drop-shadow(0 0 10px var(--mg))}
.pt{position:absolute;bottom:-24px;left:var(--x);font-size:1.15rem;opacity:0;animation:rise var(--d) ease-out var(--s) infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translate(14px,-190px) scale(1.1) rotate(20deg);opacity:0}}
.bst{position:absolute;font-size:1.3rem;translate:-50% -50%;pointer-events:none;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(1.4) rotate(120deg);opacity:0}}
.bounce .big{animation:bounce .9s cubic-bezier(.3,0,.4,1) infinite}
@keyframes bounce{0%,100%{transform:translateY(36px) scale(1.15,.8)}50%{transform:translateY(-28px) rotate(180deg)}}
.pulse .big{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.3)}}
.write .big{animation:wig .5s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-16deg) translateX(-12px)}to{transform:rotate(10deg) translateX(12px)}}
.arc .big{animation:arc 1.1s ease-in-out infinite alternate}
@keyframes arc{0%{transform:translate(-100px,24px) rotate(-40deg)}50%{transform:translate(0,-36px)}100%{transform:translate(100px,24px) rotate(40deg)}}
.swim .big{animation:swim 2.2s linear infinite}
@keyframes swim{0%{transform:translate(-140px,8px)}25%{transform:translate(-70px,-8px)}50%{transform:translate(0,8px)}75%{transform:translate(70px,-8px)}100%{transform:translate(140px,8px)}}
.chop .big{animation:chop .9s ease-in-out infinite}
@keyframes chop{0%,55%,100%{transform:none}68%{transform:rotate(-28deg) scale(1.35)}80%{transform:rotate(16deg) scale(.9)}}
.drop .big{animation:drop 1.8s cubic-bezier(.3,1.6,.4,1) infinite}
@keyframes drop{0%{transform:translateY(-90px) rotate(-20deg);opacity:0}30%{transform:rotate(8deg);opacity:1}70%{transform:rotate(-6deg)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.tilt,.coin{animation:none!important}}
</style>
</head>

cur=i;spin(0);const m=M[i],pe=m[5].split(' ');
page.innerHTML=`<div class="bar"><button class="glass bkb">Back</button><i class="mini"></i></div>
<div class="tilt"><div class="cw"><div class="coin"><div class="f"><img src="${P[i]}" alt="${m[0]}"></div><div class="cb"><div><i class="mini"></i></div></div></div></div>
<h2 class="gt" data-t="${m[0]}">${m[0]}</h2><p class="sk">${m[1]}</p>${m[2]?`<span class="chip">${m[2]}</span>`:''}
<div class="fx ${m[4]}"><span class="big">${m[3]}</span>${[...Array(8)].map((_,k)=>`<span class="pt" style="--x:${(k*13+7)%84+4}%;--d:${1.6+(k%4)*.5}s;--s:${-k*.35}s">${pe[k%pe.length]}</span>`).join('')}</div>
<p class="hint">Drag to tilt. Tap the photo to spin.</p></div>
<div class="nav"><button class="glass pv" aria-label="Previous member">Prev</button><button class="glass nx" aria-label="Next member">Next</button></div>`;
tl=page.querySelector('.tilt');[...tl.children].forEach((c,k)=>c.style.setProperty('--k',k));
page.classList.add('on');page.querySelector('.bkb').focus({preventScroll:true})}
function close(){page.classList.remove('on');last&&last.focus({preventScroll:true});spin(st.classList.contains('open'))}
function hide(){history.state&&history.state.p?history.back():close()}
addEventListener('popstate',close);
function tilt(x,y){tl.style.setProperty('--ry',x*22+'deg');tl.style.setProperty('--rx',-y*22+'deg')}
page.addEventListener('pointermove',e=>{if(!tl)return;const r=page.getBoundingClientRect();tl.classList.add('t');tilt((e.clientX-r.left)/r.width-.5,(e.clientY-r.top)/r.height-.5)});
page.addEventListener('pointerup',e=>{if(tl&&e.pointerType==='touch')tilt(0,0)});
page.addEventListener('pointerdown',e=>{const f=e.target.closest('.fx');if(!f)return;const r=f.getBoundingClientRect(),pe=[M[cur][3],...M[cur][5].split(' ')];
for(let k=0;k<7;k++){const s=document.createElement('span'),g=k/7*6.283+Math.random(),d=50+Math.random()*50;s.className='bst';s.textContent=pe[k%pe.length];s.style.cssText=`left:${e.clientX-r.left}px;top:${e.clientY-r.top}px;--dx:${Math.cos(g)*d}px;--dy:${Math.sin(g)*d}px`;f.appendChild(s);s.onanimationend=()=>s.remove()}});
page.onclick=e=>{const t=e.target;if(t.closest('.bkb'))return hide();if(t.closest('.pv'))return show((cur+8)%9);if(t.closest('.nx'))return show((cur+1)%9);const c=t.closest('.cw');if(c)c.querySelector('.coin').animate([{transform:'rotateY(0)'},{transform:'rotateY(720deg)'}],{duration:1100,easing:'cubic-bezier(.2,.8,.2,1)'})};
page.addEventListener('transitionend',e=>{if(e.target===page&&!page.classList.contains('on'))page.innerHTML=''});
addEventListener('keydown',e=>{if(e.key==='Escape'&&page.classList.contains('on'))hide()});
</script>
</body>
</html>
